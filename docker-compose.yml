# Base CPU — fonctionne partout, y compris sans carte NVIDIA.
# Pour le GPU, ajouter l'override :
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

x-app: &app
  build:
    context: .
    target: runtime
    args:
      BASE_IMAGE: ubuntu:24.04
  # Version déployée (make deploy) : le code est dans l'image, figé.
  image: transcription-video-audio:${APP_TAG:-latest}
  env_file: .env
  environment:
    # Mot de passe obligatoire, lu dans .env : caractères sûrs dans une URL
    # (ex. openssl rand -hex 24).
    DATABASE_URL: postgresql://transcription:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}@postgres:5432/transcription
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    APP_VERSION: ${APP_TAG:-latest}   # affichée dans l'interface (Réglages)
    WORK_DIR: /data/tmp
    OUTPUT_DIR: /data/out
    # Chemins côté hôte, affichés dans l'interface.
    MEDIA_PATH_HOST: ${MEDIA_PATH:-./media}
    OUTPUT_PATH_HOST: ${OUTPUT_PATH:-./output}
  # Pas de code monté ici : la version installée ne change pas quand on modifie
  # les fichiers. Pour travailler en direct : make dev (docker-compose.dev.yml).
  volumes:
    # Sources lues sur place, jamais copiées : un fichier de 2 To ne tient ni
    # dans le volume Docker ni dans un upload navigateur. MEDIA_PATH peut
    # pointer vers un disque externe, ex. /mnt/e/videos.
    - ${MEDIA_PATH:-./media}:/media:ro
    # Fichiers temporaires (piste audio extraite, morceaux, uploads) : volume
    # Docker par défaut, ou un dossier sur un gros disque (WORK_PATH dans .env).
    - ${WORK_PATH:-data}:/data
    # Résultats dans un dossier de l'hôte, accessibles depuis Windows.
    - ${OUTPUT_PATH:-./output}:/data/out
    - models:/models                # cache des modèles Whisper
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  api:
    <<: *app
    ports:
      # Port hôte configurable : 8000 est souvent déjà pris (API_PORT dans .env).
      # Joignable depuis cette machine seulement : l'API n'a pas
      # d'authentification. BIND_ADDRESS=0.0.0.0 l'ouvre au réseau (à éviter).
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    command: >
      uvicorn source.api:app --host 0.0.0.0 --port 8000
    # Seule l'API écrit dans MEDIA_PATH (suppression d'une vidéo depuis
    # l'interface) ; worker et cli le gardent en lecture seule. La liste
    # remplace entièrement celle de x-app : la garder synchronisée.
    volumes:
      - ${MEDIA_PATH:-./media}:/media
      - ${WORK_PATH:-data}:/data
      - ${OUTPUT_PATH:-./output}:/data/out
      - models:/models

  worker:
    <<: *app
    # concurrency=1 : un seul modèle Whisper en mémoire par conteneur.
    # Pour paralléliser, augmenter le nombre de répliques, pas la concurrence.
    command: >
      celery -A source.tasks:celery_app worker
      --loglevel=info --concurrency=1 --max-tasks-per-child=4
    ports: []
    healthcheck:
      disable: true

  # Tâches ponctuelles en ligne de commande :
  #   docker compose run --rm cli python main.py transcribe /media/cours.mp4
  cli:
    <<: *app
    profiles: ["cli"]
    command: ["python", "main.py", "--help"]
    ports: []
    restart: "no"
    healthcheck:
      disable: true

  # Tests automatisés : docker compose --profile test run --rm test (ou make test).
  # Autonomes : base SQLite et courtier simulés, aucun service requis.
  test:
    build:
      context: .
      target: test
      args:
        BASE_IMAGE: ubuntu:24.04
    image: transcription-video-audio:test
    profiles: ["test"]
    environment:
      DATABASE_URL: sqlite:////tmp/tests.db
      COVERAGE_FILE: /tmp/.coverage       # dépôt monté en lecture seule
    volumes:
      # Dépôt entier en lecture seule : les tests vérifient aussi la
      # configuration (compose, Dockerfile, .gitignore) sans rien modifier.
      - .:/app:ro
      # .env masqué : les réglages locaux ne doivent pas influencer les tests.
      - /dev/null:/app/.env:ro
    command: ["pytest"]
    restart: "no"
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transcription
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: transcription
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcription"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      # Console locale uniquement : Qdrant n'a pas de clé d'API ici.
      - "${BIND_ADDRESS:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  data:
  models:
  pgdata:
  redisdata:
  qdrantdata:
